name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-api:
    name: Deploy API to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  deploy-client:
    name: Deploy client to Vercel
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

  smoke-test:
    name: Smoke test live URLs
    runs-on: ubuntu-latest
    needs: deploy-client
    steps:
      - name: Wait for API to come up
        run: |
          for i in $(seq 1 20); do
            if curl -fsSL https://thabang-phala-api.onrender.com/api/health; then
              echo "API is healthy"
              exit 0
            fi
            echo "Attempt $i: API not ready yet..."
            sleep 15
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Check client responds
        run: |
          code=$(curl -fsSL -o /dev/null -w "%{http_code}" https://thabang-phala.vercel.app/)
          echo "Client HTTP $code"
          test "$code" = "200"
