# Render Blueprint for the Thabang Phala API (free plan).
# Database is hosted on Neon (free, does not expire) — set DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: thabang-phala-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: DATABASE_URL
        sync: false   # paste the Neon connection string (with ?sslmode=require)
      - key: CORS_ORIGINS
        sync: false   # e.g. https://thabang-phala.vercel.app
